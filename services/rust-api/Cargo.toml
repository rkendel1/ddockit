[package]
name = "ddockit-rust-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "repository-intelligence-runtime"
path = "src/main.rs"

[dependencies]
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
url = "2"
